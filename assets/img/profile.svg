<!-- Monogram placeholder. Swap in a real photo as assets/img/profile.jpg and
     point the <img src> inside .avatar (index.html) at it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320"
     role="img" aria-label="Monogram placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1e8"/>
      <stop offset="1" stop-color="#e6e0d2"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ad4a2b"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#ad4a2b" opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="320" height="320" fill="url(#bg)"/>
  <rect width="320" height="320" fill="url(#dots)"/>
  <rect width="320" height="320" fill="url(#glow)"/>

  <!-- concentric rings, centred on the monogram -->
  <circle cx="160" cy="136" r="86" fill="none" stroke="url(#acc)" stroke-width="1" opacity="0.3"/>
  <circle cx="160" cy="136" r="64" fill="none" stroke="url(#acc)" stroke-width="1.8" opacity="0.62"/>
  <circle cx="160" cy="136" r="64" fill="url(#acc)" opacity="0.09"/>

  <!-- corner ticks -->
  <path d="M28 60V28h32M292 60V28h-32M28 260v32h32M292 260v32h-32"
        fill="none" stroke="url(#acc)" stroke-width="1.6" opacity="0.5"/>

  <text x="160" y="140" text-anchor="middle" dominant-baseline="central"
        font-family="'Space Grotesk',system-ui,sans-serif" font-size="52" font-weight="700"
        fill="#5a3526" letter-spacing="3">DA</text>

  <text x="160" y="246" text-anchor="middle"
        font-family="ui-monospace,'JetBrains Mono',monospace" font-size="10.5"
        fill="#7d6a5c" letter-spacing="3">DJORGHI ANDIMA</text>
  <line x1="112" y1="262" x2="208" y2="262" stroke="#ad4a2b" stroke-width="1" opacity="0.4"/>
  <text x="160" y="282" text-anchor="middle"
        font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9"
        fill="#95836f" letter-spacing="2.5">PHOTO PLACEHOLDER</text>
</svg>

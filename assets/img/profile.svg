<!-- Monogram placeholder. Swap in a real photo as assets/img/profile.jpg and
     point the <img src> inside .avatar (index.html) at it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320"
     role="img" aria-label="Monogram placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e241c"/>
      <stop offset="1" stop-color="#061410"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#10b981" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="320" height="320" fill="url(#bg)"/>
  <rect width="320" height="320" fill="url(#dots)"/>
  <rect width="320" height="320" fill="url(#glow)"/>

  <!-- concentric rings, centred on the monogram -->
  <circle cx="160" cy="136" r="86" fill="none" stroke="url(#acc)" stroke-width="1" opacity="0.28"/>
  <circle cx="160" cy="136" r="64" fill="none" stroke="url(#acc)" stroke-width="1.8" opacity="0.6"/>
  <circle cx="160" cy="136" r="64" fill="url(#acc)" opacity="0.08"/>

  <!-- corner ticks -->
  <path d="M28 60V28h32M292 60V28h-32M28 260v32h32M292 260v32h-32"
        fill="none" stroke="url(#acc)" stroke-width="1.6" opacity="0.45"/>

  <text x="160" y="140" text-anchor="middle" dominant-baseline="central"
        font-family="'Space Grotesk',system-ui,sans-serif" font-size="52" font-weight="700"
        fill="#e9f1ed" letter-spacing="3">DA</text>

  <text x="160" y="246" text-anchor="middle"
        font-family="ui-monospace,'JetBrains Mono',monospace" font-size="10.5"
        fill="#7e948b" letter-spacing="3">DJORGHI ANDIMA</text>
  <line x1="112" y1="262" x2="208" y2="262" stroke="#10b981" stroke-width="1" opacity="0.35"/>
  <text x="160" y="282" text-anchor="middle"
        font-family="ui-monospace,'JetBrains Mono',monospace" font-size="9"
        fill="#5d6f68" letter-spacing="2.5">PHOTO PLACEHOLDER</text>
</svg>

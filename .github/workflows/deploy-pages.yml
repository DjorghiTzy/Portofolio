name: Deploy to GitHub Pages

# GitHub Actions cannot name "the default branch" in a push filter, so this
# listens on every branch and the job below runs only on the default one.
# That keeps working if the default is later renamed to main.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pages has to be switched on by a repository admin once
      # (Settings → Pages → Source: GitHub Actions). GITHUB_TOKEN cannot do
      # it — the create-site endpoint needs admin rights. Until then this
      # step fails, so the run reports a notice and skips instead of going
      # red on every push; it starts deploying by itself once Pages is on.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Pages not enabled
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice title=GitHub Pages is off::Enable it under Settings → Pages → Build and deployment → Source: GitHub Actions. This workflow will then deploy on its own."

      - name: Upload artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          # The site is plain HTML/CSS/JS — the repo root is the artifact.
          path: .

      - name: Deploy
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
